<line x1="660" y1="60" x2="688" y2="60" stroke="#59636E" stroke-width="2.5" stroke-dasharray="8 7"/>
<text x="698" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1F2328" text-anchor="start">50 Hz cosine locked to UTC</text>
<text x="40" y="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#59636E" text-anchor="start">Above 50 Hz the measured wave runs ahead of the UTC reference, so the phasor turns. Its angle is the synchrophasor;</text>
<text x="40" y="404" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#59636E" text-anchor="start">the rate of turning gives frequency, and the change of that rate gives ROCOF. Rotation is slowed here for display.</text>
