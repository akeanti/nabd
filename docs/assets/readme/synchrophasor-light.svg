<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
<title id="title">How a node reports a synchrophasor</title>
<desc id="desc">A voltage phasor turns against a 50 Hz cosine reference locked to UTC, while the measured waveform drifts ahead of the reference at reporting instants spaced 20 ms apart.</desc>
<style>.turn{transform-box:fill-box;transform-origin:center}.ring{transform-box:fill-box;transform-origin:center;opacity:.3}@media (prefers-reduced-motion:no-preference){.turn-fast{animation:turn 4s linear infinite}.turn-slow{animation:turn 12s linear infinite}.flow-right{animation:flow-right 4s linear infinite}.flow-left{animation:flow-left 12s linear infinite}.ring{animation:pulse 3s ease-out infinite}.dash{animation:dash 1.2s linear infinite}}@keyframes turn{to{transform:rotate(-360deg)}}@keyframes flow-right{to{transform:translateX(160px)}}@keyframes flow-left{to{transform:translateX(-152px)}}@keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(3.4);opacity:0}}@keyframes dash{to{stroke-dashoffset:-20}}</style>
