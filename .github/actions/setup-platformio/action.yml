name: Set up PlatformIO
description: Install Python with the firmware tooling pinned in firmware/requirements.txt and restore the PlatformIO package cache.

inputs:
  cache:
    description: Restore and save the pip and PlatformIO caches. Release builds pass false so that no cached content reaches published images.
    required: false
    default: "true"
  cache-scope:
    description: Separates PlatformIO caches whose package sets differ, such as host tests and ESP32-S3 builds.
    required: false
    default: default

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
        cache: ${{ inputs.cache == 'true' && 'pip' || '' }}
        cache-dependency-path: firmware/requirements.txt

    - name: Restore PlatformIO packages
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.platformio
        key: platformio-${{ runner.os }}-${{ inputs.cache-scope }}-${{ hashFiles('firmware/platformio.ini') }}

    - name: Install firmware tooling
      shell: bash
      run: python -m pip install --disable-pip-version-check -r firmware/requirements.txt
