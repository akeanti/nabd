name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install clang-format pinned in firmware/requirements.txt
        run: pip install "$(grep -E '^clang-format==' firmware/requirements.txt)"
      - name: Check C and C++ formatting
        run: git ls-files -z -- '*.c' '*.cpp' '*.h' '*.hpp' | xargs -0 --no-run-if-empty clang-format --dry-run --Werror

  firmware-test:
    name: firmware host tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: firmware/requirements.txt
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: platformio-native-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install -r requirements.txt
      - run: pio test -e native

  firmware-build:
    name: firmware build (${{ matrix.env }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        env: [tier_a, tier_b]
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: firmware/requirements.txt
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: platformio-esp32s3-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install -r requirements.txt
      - run: pio run -e ${{ matrix.env }}
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.env }}
          path: |
            firmware/.pio/build/${{ matrix.env }}/bootloader.bin
            firmware/.pio/build/${{ matrix.env }}/partitions.bin
            firmware/.pio/build/${{ matrix.env }}/ota_data_initial.bin
            firmware/.pio/build/${{ matrix.env }}/firmware.bin
          retention-days: 14

  python-lint:
    name: python lint and types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: black --check .
      - run: mypy

  python-test:
    name: python tests (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest

  web:
    name: web typecheck and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  markdown-links:
    name: markdown links
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --no-progress '**/*.md'
          fail: true

  text-style:
    name: text style
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python .github/scripts/check_text_style.py
