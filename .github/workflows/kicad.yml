name: kicad

on:
  push:
    branches: [main]
    paths:
      - hardware/**
      - .github/workflows/kicad.yml
  pull_request:
    paths:
      - hardware/**
      - .github/workflows/kicad.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: kicad-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  check:
    name: ERC, DRC, and fabrication outputs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      image: kicad/kicad:8.0.9@sha256:5716d82aa247abdbe512650eb4e8fce5a4031cbbef0a2c8df83208a69fef87b2
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find the KiCad project
        id: project
        run: |
          project="$(find hardware -name '*.kicad_pro' -print -quit)"
          if [[ -z "$project" ]]; then
            echo "::notice::No KiCad project under hardware/ yet."
          fi
          echo "base=${project%.kicad_pro}" >> "$GITHUB_OUTPUT"
      - name: Electrical rules check
        if: steps.project.outputs.base != ''
        env:
          BASE: ${{ steps.project.outputs.base }}
        run: |
          mkdir -p out
          kicad-cli sch erc --severity-error --exit-code-violations --output out/erc.rpt "${BASE}.kicad_sch"
      - name: Design rules check
        if: steps.project.outputs.base != ''
        env:
          BASE: ${{ steps.project.outputs.base }}
        run: kicad-cli pcb drc --severity-error --exit-code-violations --schematic-parity --output out/drc.rpt "${BASE}.kicad_pcb"
      - name: Export schematic PDF, Gerber, and drill files
        if: steps.project.outputs.base != ''
        env:
          BASE: ${{ steps.project.outputs.base }}
        run: |
          mkdir -p out/gerbers
          kicad-cli sch export pdf --output out/schematic.pdf "${BASE}.kicad_sch"
          kicad-cli pcb export gerbers --output out/gerbers/ "${BASE}.kicad_pcb"
          kicad-cli pcb export drill --output out/gerbers/ "${BASE}.kicad_pcb"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.project.outputs.base != '' }}
        with:
          name: kicad-outputs
          path: out/
