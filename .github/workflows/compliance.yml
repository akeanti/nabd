name: compliance

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: compliance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  p-class:
    name: IEEE C37.118.1 P class
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S compliance -B compliance/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build compliance/build --parallel
      - name: Run test conditions
        run: compliance/build/nabd_compliance > "$RUNNER_TEMP/compliance-report.md"
      - name: Add report to the job summary
        if: ${{ !cancelled() }}
        run: |
          if [[ -f "$RUNNER_TEMP/compliance-report.md" ]]; then
            cat "$RUNNER_TEMP/compliance-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: compliance-report
          path: ${{ runner.temp }}/compliance-report.md
          if-no-files-found: warn
