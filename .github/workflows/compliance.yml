name: compliance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compliance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p-class:
    name: IEEE C37.118.1 P class
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S compliance -B compliance/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build compliance/build --parallel
      - name: Run test conditions
        run: compliance/build/nabd_compliance --report compliance/build/report.md
      - name: Add report to job summary
        if: always()
        run: |
          if [ -f compliance/build/report.md ]; then
            cat compliance/build/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compliance-report
          path: compliance/build/report.md
          if-no-files-found: warn
