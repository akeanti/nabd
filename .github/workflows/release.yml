name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  version:
    name: resolve version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Resolve the version and check that every manifest declares it
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            tag="$GITHUB_REF_NAME"
            publish=true
          else
            tag="v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
            publish=false
            echo "::notice::Manual run: building and packaging ${tag} as a dry run without attesting or publishing."
          fi
          python .github/scripts/check_release_version.py "$tag"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

  firmware:
    name: firmware
    needs: version
    permissions:
      contents: read
    strategy:
      matrix:
        environment: [tier_a, tier_b]
    uses: ./.github/workflows/firmware-build.yml
    with:
      environment: ${{ matrix.environment }}
      cache: false
      fetch-depth: 0

  package:
    name: package images
    needs: [version, firmware]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install esptool pinned in firmware/requirements.txt
        run: python -m pip install --disable-pip-version-check "$(grep -E '^esptool==' firmware/requirements.txt)"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: firmware-tier_*
          path: ${{ runner.temp }}/build
      - name: Merge flashable images and write browser flasher manifests
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD_ROOT: ${{ runner.temp }}/build
        run: |
          mkdir -p dist
          for tier in a b; do
            build="${BUILD_ROOT}/firmware-tier_${tier}"
            image="nabd-tier-${tier}-${VERSION}-merged.bin"
            esptool --chip esp32s3 merge-bin --output "dist/${image}" \
              0x0 "${build}/bootloader.bin" \
              0x8000 "${build}/partitions.bin" \
              0xe000 "${build}/ota_data_initial.bin" \
              0x10000 "${build}/firmware.bin"
            cp "${build}/firmware.bin" "dist/nabd-tier-${tier}-${VERSION}-ota.bin"
            jq -n \
              --arg name "Nabd node, tier ${tier^^}" \
              --arg version "${VERSION}" \
              --arg path "${image}" \
              '{name: $name, version: $version, new_install_prompt_erase: true,
                builds: [{chipFamily: "ESP32-S3", parts: [{path: $path, offset: 0}]}]}' \
              > "dist/manifest-tier-${tier}.json"
          done
          (cd dist && sha256sum -- *.bin *.json > SHA256SUMS)
      - name: Summarize release assets
        run: |
          {
            echo "### Release assets"
            echo
            echo "| File | Bytes | SHA-256 |"
            echo "| --- | ---: | --- |"
            while read -r digest file; do
              echo "| \`${file}\` | $(stat -c %s "dist/${file}") | \`${digest}\` |"
            done < dist/SHA256SUMS
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Attest build provenance
        if: needs.version.outputs.publish == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.bin
          create-storage-record: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  publish:
    name: publish release
    needs: [version, package]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install git-cliff pinned in pyproject.toml
        run: python -m pip install --disable-pip-version-check "$(grep -oE 'git-cliff==[0-9.]+' pyproject.toml)"
      - name: Generate release notes from Conventional Commits
        run: git cliff --latest --strip header --output "$RUNNER_TEMP/release-notes.md"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Nabd $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag "${flags[@]}"
      - name: Rebuild the documentation site so that the browser flasher serves this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
