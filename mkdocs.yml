site_name: Nabd
site_description: Open network of GPS-synchronized ESP32 nodes measuring grid frequency, ROCOF, and voltage synchrophasors.
site_url: https://OWNER.github.io/nabd/
repo_url: https://github.com/OWNER/nabd
repo_name: OWNER/nabd
edit_uri: edit/main/docs/
copyright: Code MIT, hardware CERN-OHL-P-2.0, dataset CC BY 4.0
exclude_docs: |
  requirements.txt

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Hardware and safety: hardware.md
  - Privacy: privacy.md
  - Architecture: architecture.md
  - Flash a node: flash.md
  - Contributing: https://github.com/OWNER/nabd/blob/main/CONTRIBUTING.md
